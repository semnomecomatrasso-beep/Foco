name: Build FOCUS FORCE APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Localizar projeto (descompacta o zip se precisar)
        run: |
          if [ ! -f package.json ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then unzip -o -q "$z" -d projeto_extraido; fi
            done
          fi
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1 | xargs -r dirname)
          if [ -z "$P" ]; then echo "package.json nao encontrado no repositorio"; exit 1; fi
          echo "Projeto em: $P"
          echo "P=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependencias
        run: cd "$P" && npm install
      - name: Preparar arquivos web (MediaPipe offline)
        run: |
          cd "$P"
          mkdir -p www/vendor
          cp src/index.html www/
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs www/vendor/
          cp -r node_modules/@mediapipe/tasks-vision/wasm www/vendor/
          curl -fL -o www/vendor/pose.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
      - name: Criar projeto Android
        run: |
          cd "$P"
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' $M
          npx cap sync android
      - name: Compilar APK
        run: |
          cd "$P/android"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Renomear APK
        run: cp "$P/android/app/build/outputs/apk/debug/app-debug.apk" FocusForce.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusForce-APK
          path: FocusForce.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FOCUS FORCE v${{ github.run_number }}
          files: FocusForce.apk
